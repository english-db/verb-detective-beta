<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Irregular Verbs Learning Activity - Part 1">
    <title>Irregular Verbs - Part</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Menu View -->
        <div id="menuView" class="view">
            <button id="orientationBackButton" class="btn-library" type="button" aria-label="Back to orientation">
                <img class="btn-library__icon btn-library__icon--off" src="assets/parts/part1/images/library_off.png" alt="" aria-hidden="true">
                <img class="btn-library__icon btn-library__icon--on" src="assets/parts/part1/images/library_on.png" alt="" aria-hidden="true">
                <span class="sr-only">Back to orientation</span>
            </button>
            <div class="menu-header">
                <h1 id="partTitle">Irregular Verbs - Part</h1>
            </div>
            <div id="roomGrid" class="room-grid">
                <!-- Room cards rendered here by uiRenderer -->
            </div>
            <div class="menu-footer">
                <button id="acknowledgmentsButton" class="menu-footer-link" type="button">
                    Acknowledgments
                </button>
            </div>
            <div id="partVictoryOverlay" class="part-victory-overlay hidden" aria-hidden="true">
                <div id="partVictoryConfettiBack" class="part-victory-confetti part-victory-confetti--back"></div>
                <div class="part-victory-characters" aria-hidden="true">
                    <img id="partVictoryCharacterLeft" class="part-victory-character part-victory-character--left" src="assets/common/images/victory1.png" alt="">
                    <img id="partVictoryCharacterRight" class="part-victory-character part-victory-character--right" src="assets/common/images/victory2.png" alt="">
                </div>
                <div id="partVictoryConfettiFront" class="part-victory-confetti part-victory-confetti--front"></div>
            </div>
            <button id="resetProgressButton" class="btn-reset-progress" type="button" aria-label="Reset Progress">
                <span class="sr-only">Reset Progress</span>
            </button>
        </div>

        <!-- Room View -->
        <div id="roomView" class="view hidden">
            <div class="room-header">
                <button id="backButton" class="btn-back" type="button">← Back to Menu</button>
                <h2 id="roomTitle"></h2>
                <div class="progress-stack">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div id="roomProgress" class="progress-fill"></div>
                        </div>
                        <span id="progressPercent" class="progress-text">0%</span>
                    </div>
                    <div id="stageIndicator" class="stage-indicator">Stage 1 / 13</div>
                </div>
            </div>

            <div id="instructionBanner" class="instruction-banner">
                <span id="instructionText" class="instruction-text"></span>
                <div id="instructionMeta" class="instruction-meta">
                    <div id="instructionLives" class="instruction-lives hidden" aria-label="Challenge lives"></div>
                    <button id="instructionButton" class="instruction-button hidden" type="button"></button>
                </div>
            </div>

            <div class="room-container">
                <div id="roomImageContainer" class="room-image-container">
                    <img id="roomImage" src="" alt="Room">
                    <div id="hotspotsLayer" class="hotspots-layer"></div>
                    <div id="iconsLayer" class="icons-layer"></div>
                    <div id="writtenOverlay" class="written-overlay hidden"></div>
                </div>

                <div id="activityPanel" class="activity-panel">
                    <div id="activityContent" class="activity-content">
                        <!-- Activity UI rendered here by uiRenderer -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti overlay -->
    <div id="confettiContainer" class="confetti-container"></div>

    <!-- Legacy modal overlay -->
    <div id="legacyModalOverlay" class="legacy-modal-overlay hidden" role="presentation" aria-hidden="true">
        <div id="legacyModalContent" class="legacy-modal-content-wrapper" role="dialog" aria-modal="true"></div>
    </div>

    <!-- Temporary developer shortcut -->
    <button id="developerModeButton" class="developer-mode-button hidden" type="button">
        Dev -> next stage
    </button>

    <!-- Feedback Layer (success/error messages) -->
    <div id="feedbackLayer" class="feedback-layer hidden">
        <div id="feedbackContent" class="feedback-content"></div>
    </div>

    <!-- Audio Elements -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Script Modules (in dependency order) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
